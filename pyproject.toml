[project]
name = "flowjudge"
version = "0.1.0"
description = "Offline-first benchmark for debate response-graph reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.69.0",
  "openai>=2.6.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
]

[project.scripts]
flowjudge = "flowjudge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]
train = [
  "accelerate>=1.10.0",
  "bitsandbytes>=0.47.0; sys_platform == 'linux'",
  "datasets>=4.0.0",
  "huggingface-hub>=0.34.0",
  "peft>=0.17.0",
  "torch>=2.7.0",
  "transformers>=4.56.0",
]
mlx-train = [
  "mlx-lm[train]>=0.28.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowjudge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
